name: Cross-Platform Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libpq-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cross-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cargo-zigbuild

      - name: Build with zigbuild
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vortex--${{ matrix.target }}.tar.gz vortex--
          cd ../../..

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex--${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vortex--
          compression-level: 6

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cross-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vortex--*
          path: release-assets
          merge-multiple: false

      - name: List assets
        run: |
          find release-assets -type f | sort
          echo "---"
          find release-assets -name "*.tar.gz" -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          fail_on_unmatched_files: false
          files: |
            release-assets/vortex--*/vortex--*.tar.gz
          generate_release_notes: true
          draft: true
