name: Cross-Platform Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-assets
          cd target/${{ matrix.target }}/release
          tar czf ../../../../release-assets/vortex--${{ matrix.target }}.tar.gz vortex--
          cd ../../../..

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex--${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vortex--
          compression-level: 6

      - name: Upload release tarball
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: vortex--${{ matrix.target }}-tarball
          path: release-assets/vortex--${{ matrix.target }}.tar.gz
          compression-level: 0

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cross-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vortex--*-tarball
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: |
          echo "Release assets:"
          find release-assets -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
