services:
  postgres:
    image: postgres:17-alpine
    container_name: vortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vortex_password}
      POSTGRES_DB: vortex
      POSTGRES_MAX_CONNECTIONS: 500
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "full_page_writes=on"
      - "-c"
      - "max_worker_processes=12"
      - "-c"
      - "max_parallel_workers=6"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "parallel_tuple_cost=0.1"
      - "-c"
      - "parallel_setup_cost=100"
      - "-c"
      - "autovacuum=on"
      - "-c"
      - "autovacuum_max_workers=6"
      - "-c"
      - "autovacuum_naptime=30s"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.01"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.01"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vortex -d vortex" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 6G
        reservations:
          cpus: '2'
          memory: 2G
    networks:
      - vortex-network

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.85
    container_name: vortex-seaweedfs-master
    restart: unless-stopped
    command: "master -ip=seaweedfs-master -port=9333 -mdir=/data -defaultReplication=001"
    volumes:
      - seaweedfs_master_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9333/cluster/status" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - vortex-network

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.85
    container_name: vortex-seaweedfs-volume
    restart: unless-stopped
    command: >
      volume -ip=seaweedfs-volume -port=9178 -mserver=seaweedfs-master:9333 -dir=/data -max=100 -concurrency=128 -compactionMBps=50 -volumeSizeLimitMB=1024
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
    networks:
      - vortex-network

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.85
    container_name: vortex-seaweedfs-filer
    restart: unless-stopped
    command: >
      filer -ip=seaweedfs-filer -port=8888 -master=seaweedfs-master:9333 -concurrency=64 -defaultReplicaPlacement=001
    volumes:
      - seaweedfs_filer_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks:
      - vortex-network

  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.85
    container_name: vortex-seaweedfs-s3
    restart: unless-stopped
    command: >
      s3 -ip=seaweedfs-s3 -port=8333 -filer=seaweedfs-filer:8888 -concurrency=128 -allowEmptyFolder=false
    depends_on:
      seaweedfs-filer:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks:
      - vortex-network

  seaweedfs-init:
    image: chrislusf/seaweedfs:3.85
    container_name: vortex-seaweedfs-init
    depends_on:
      seaweedfs-s3:
        condition: service_started
    entrypoint: >
      /bin/sh -c " sleep 3 && curl -X PUT http://seaweedfs-s3:8333/vortex-files || true "
    networks:
      - vortex-network

volumes:
  postgres_data:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:

networks:
  vortex-network:
    driver: bridge
