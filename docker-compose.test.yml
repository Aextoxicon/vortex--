# =============================================================================
# Vortex k6 压测 Docker Compose 覆盖配置
# =============================================================================
# 说明：
#   这是一个 Docker Compose overlay 文件，需要与主 docker-compose.yml 叠加使用。
#   它在 vortex-network 中添加一个 k6 容器，用于对 Vortex 服务进行压测。
#
# 前置条件：
#   1. 已执行 docker compose up -d 启动 Vortex 应用
#   2. JWT_SECRET 已在 .env 中配置（参考 initvortex.ps1）
#
# 用法示例：
#
#   1. 冒烟测试（默认）：
#      docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm k6
#
#   2. 指定测试类型：
#      docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm k6 run /loadtest/stress.js
#      docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm k6 run /loadtest/spike.js
#      docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm k6 run /loadtest/soak.js
#
#   3. 生成 HTML 报告：
#      docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm ^
#        -e K6_OUT=html=/loadtest/reports/report.html k6 run /loadtest/stress.js
#
#   4. 交互式调试：
#      docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --entrypoint sh k6
#
#   5. 指定不同服务器：
#      docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm ^
#        -e K6_BASE_URL=http://192.168.1.100:9178 k6 run /loadtest/smoke.js
#
# 清理：docker compose -f docker-compose.yml -f docker-compose.test.yml down
# =============================================================================

services:
  k6:
    image: grafana/k6:latest
    container_name: vortex-k6
    environment:
      # 通过 Docker 内部网络访问 Vortex 服务（而非 localhost）
      - K6_BASE_URL=http://vortex:9178
      # 默认仅输出到终端；需要报告时通过 -e 覆盖：
      #   -e K6_OUT=html=/loadtest/reports/vortex-report.html
      #   -e K6_OUT=json=/loadtest/reports/vortex-report.json
      #   -e K6_OUT=csv=/loadtest/reports/vortex-report.csv
    volumes:
      # 挂载 loadtest 目录，使 k6 能直接访问所有脚本
      - ./loadtest:/loadtest
    working_dir: /loadtest
    # grafana/k6 镜像的 ENTRYPOINT 为 "k6"，所以 command 直接写 k6 子命令
    # 默认运行冒烟测试（1 VU, 30s），可通过 command 覆盖
    command: ["run", "/loadtest/smoke.js"]
    depends_on:
      vortex:
        condition: service_healthy
    networks:
      - vortex-network
    # 不暴露端口 — k6 是客户端工具，不需要监听

networks:
  vortex-network:
    external: true
